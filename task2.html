<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 · Quest board — Quest Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/task2.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="index.html">⚔ Quest Hub</a>
      <nav class="nav" aria-label="Main">
        <a href="task1.html">Battle</a>
        <a href="task2.html" class="is-current" aria-current="page">Quest board</a>
        <a href="task3.html">Character creator</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <h1>Guild quest board</h1>
    <p class="page__intro">Move quests from <em>To do</em> to <em>Done</em>. A hero can carry at most 3 quests <em>In progress</em> at the same time.</p>

    <div class="toolbar">
      <div class="toolbar__field">
        <label for="search">Search by title</label>
        <input type="search" id="search" placeholder="e.g. goblin" autocomplete="off">
      </div>
      <div class="toolbar__field">
        <label for="tag-filter">Filter by tag</label>
        <select id="tag-filter"></select>
      </div>
      <div class="toolbar__field">
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="none">Added order</option>
          <option value="desc">Priority: high → low</option>
          <option value="asc">Priority: low → high</option>
        </select>
      </div>
    </div>

    <div class="summary" id="summary"></div>
    <p class="msg" id="message" aria-live="polite"></p>
    <p id="found" aria-live="polite"></p>
    <div class="board" id="board"></div>

    <form class="add-form panel" id="add-form">
      <div class="toolbar__field">
        <label for="new-title">New quest</label>
        <input type="text" id="new-title" placeholder="Quest title">
      </div>
      <div class="toolbar__field">
        <label for="new-priority">Priority</label>
        <select id="new-priority">
          <option value="1">Low</option>
          <option value="2" selected>Medium</option>
          <option value="3">High</option>
        </select>
      </div>
      <div class="toolbar__field">
        <label for="new-tags">Tags</label>
        <input type="text" id="new-tags" placeholder="combat, forest">
      </div>
      <div class="toolbar__field">
        <label for="new-reward">Reward</label>
        <input type="number" id="new-reward" min="0" step="5" value="50">
      </div>
      <button type="submit" class="btn btn--primary">Add quest</button>
    </form>
  </main>

  <footer class="site-footer">Assignment 5 · Task 2 · Serikbay Daniyar, IT-2509</footer>
</body>
</html>
